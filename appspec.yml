version: 0.0
os: linux

files:
  - source: target/hr-system.jar
    destination: /opt/hr

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      runas: root

  BeforeInstall:
    - location: scripts/before.sh
      runas: root
      timeout: 600

  AfterInstall:
    - location: scripts/install_service.sh
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      runas: root

  ValidateService:
    - location: scripts/health.sh
      runas: ubuntu
      timeout: 300
