name: Deploy HR System

on:
  push:
    branches: [ develop ]          # 필요시 [ main, develop ]
  workflow_dispatch: {}            # 수동 실행도 허용

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: woosan-deploy
  S3_PREFIX: hr-system
  APP_NAME: HrSystemApp
  DG_NAME: HrSystemDG-LB          # 필요하면 HrSystemDG-noLB
  WORKDIR: .                 # 소스 폴더

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 0) 빌드 도구 자동 감지 (maven/gradle)
      - name: Detect build tool
        id: detect
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          if [ -f pom.xml ]; then
            echo "tool=maven" >> $GITHUB_OUTPUT
            echo "jar_glob=target/*.jar" >> $GITHUB_OUTPUT
          elif [ -f gradlew ] || ls build.gradle* >/dev/null 2>&1; then
            echo "tool=gradle" >> $GITHUB_OUTPUT
            echo "jar_glob=build/libs/*.jar" >> $GITHUB_OUTPUT
          else
            echo "No Maven or Gradle build files found"; exit 1
          fi
          echo "Detected tool: $(cat $GITHUB_OUTPUT)"

      # Maven: WooSan/pom.xml 이 있으면 실행
      - name: Build with Maven (if pom.xml exists)
        if: ${{ hashFiles('WooSan/pom.xml') != '' }}
        working-directory: WooSan
        run: mvn -DskipTests package

      # Gradle: pom.xml 이 없으면 실행(지금 네 상황)
      - name: Build with Gradle (if no pom.xml)
        if: ${{ hashFiles('WooSan/pom.xml') == '' }}
        working-directory: WooSan
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon clean bootJar -x test
    

      - name: Package bundle
        working-directory: WooSan
        run: |
          set -e
          mkdir -p bundle/scripts bundle/target
          cp appspec.yml bundle/
          cp scripts/*.sh bundle/scripts/
          if [ -f "target/hr-system.jar" ]; then
            # Maven 결과물
            cp target/hr-system.jar bundle/target/hr-system.jar
          else
            # Gradle 결과물
            cp build/libs/*.jar bundle/target/hr-system.jar
          fi
          cd bundle && zip -r "../hr-${GITHUB_SHA}.zip" . && cd ..
      

      # 3) 번들 구조 검증 (JAR 반드시 포함)
      - name: Verify bundle structure
        working-directory: ${{ env.WORKDIR }}
        run: |
          unzip -l "hr-${GITHUB_SHA}.zip" | sed -n '1,200p'
          unzip -l "hr-${GITHUB_SHA}.zip" | grep -q "target/hr-system.jar"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188615717003:role/GitHubOIDC-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle to S3
        working-directory: ${{ env.WORKDIR }}
        run: |
          KEY="${S3_PREFIX}/hr-${GITHUB_SHA}.zip"
          aws s3 cp "hr-${GITHUB_SHA}.zip" "s3://${S3_BUCKET}/${KEY}"

      - name: Trigger CodeDeploy
        id: deploy
        run: |
          KEY="${{ env.S3_PREFIX }}/hr-${{ github.sha }}.zip"
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "${{ env.APP_NAME }}" \
            --deployment-group-name "${{ env.DG_NAME }}" \
            --revision "revisionType=S3Location,s3Location={bucket=${{ env.S3_BUCKET }},key=${KEY},bundleType=zip}" \
            --file-exists-behavior OVERWRITE \
            --query 'deploymentId' --output text)
          echo "deployment_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "DeploymentId=$DEPLOY_ID"

      - name: Wait for CodeDeploy to finish
        run: aws deploy wait deployment-successful --deployment-id "${{ steps.deploy.outputs.deployment_id }}"
