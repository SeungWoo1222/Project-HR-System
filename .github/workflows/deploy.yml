name: Deploy HR System
on: { push: { branches: [develop] }, workflow_dispatch: {} }
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: mvn -DskipTests package
      - name: Package bundle
        run: |
          mkdir -p bundle/scripts bundle/target
          cp appspec.yml bundle/
          cp scripts/*.sh bundle/scripts/
          cp target/hr-system.jar bundle/target/
          cd bundle && zip -r ../hr-${{ github.sha }}.zip . && cd ..
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188615717003:role/GitHubOIDC-Deploy
          aws-region: ap-northeast-2
      - run: aws s3 cp hr-${{ github.sha }}.zip s3://woosan-deploy/hr-system/
      - name: Trigger CodeDeploy
        run: |
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name HrSystemApp \
            --deployment-group-name HrSystemDG-LB \
            --revision "revisionType=S3Location,s3Location={bucket=woosan-deploy,key=hr-system/hr-${{ github.sha }}.zip,bundleType=zip}" \
            --file-exists-behavior OVERWRITE \
            --query deploymentId --output text)
          echo "DeploymentId=$DEPLOY_ID"
