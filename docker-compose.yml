services:
  mysql:
    image: mysql:8.0.33
    container_name: hr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      TZ: Asia/Seoul
    ports:
      - "3307:3306"            # host 3307 -> container 3306
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:latest
    container_name: hr-localstack
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=ap-northeast-2
      # 선택: 시작 시 버킷 자동 생성하려면 아래 주석 해제 후 init 스크립트 추가
      # - LOCALSTACK_PERSISTENCE=1
    ports:
      - "4566:4566"            # LocalStack edge port
    volumes:
      - localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db:
  localstack:
