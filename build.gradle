plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.woosan'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.data:spring-data-commons'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'jakarta.validation:jakarta.validation-api:3.0.0'
	compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // Thymeleaf
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect' // Thymeleaf Layout
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6' // Thymeleaf-extras-springsecurity

	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.0' // MyBatis
//	implementation 'mysql:mysql-connector-java:8.0.33' // MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'

	implementation 'org.springframework.boot:spring-boot-starter-security' // Spring security
	implementation 'org.springframework.boot:spring-boot-starter-logging'// Logging

	implementation 'com.github.usingsky:KoreanLunarCalendar:0.3.1' // 한국 양음력 변환 github 라이브러리

	implementation files('libs/kiwi-java-v0.20.0-lnx-x86-64.jar')
//	implementation files('libs/kiwi-java-v0.20.0-lnx-aarch64.jar')
//	implementation files('libs/kiwi-java-v0.20.0-mac-arm64.jar')

	// lombok plugin
	implementation('org.projectlombok:lombok')
	annotationProcessor('org.projectlombok:lombok')

	// test 환경
	testImplementation('org.projectlombok:lombok')
	testAnnotationProcessor('org.projectlombok:lombok')
	implementation 'javax.annotation:javax.annotation-api:1.3.2'
	implementation 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.junit.jupiter:junit-jupiter-api'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'

	// AWS
	implementation 'software.amazon.awssdk:s3:2.20.64'
//	implementation 'io.awspring.cloud:spring-cloud-starter-aws-parameter-store-config'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store:3.1.1'
	implementation 'software.amazon.awssdk:sts:2.20.64'

	// localStack
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
	enabled = false
}

//dependencyManagement {
//	imports {
//		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:2.3.3"
//	}
//}

// CodeDeploy 번들(zip) 생성 태스크
tasks.register('bundleForCodeDeploy', Zip) {
	// Spring Boot면 bootJar, 아니면 jar
	dependsOn tasks.findByName('bootJar') ?: tasks.named('jar')

	archiveFileName = 'hr.zip'
	destinationDirectory = file("$buildDir/codedeploy")

	// appspec.yml 포함 (루트에 있어야 함)
	from('appspec.yml')

	// 스크립트 포함 + 실행 권한 부여
	from('scripts') {
		into 'scripts'
		fileMode = 0755
	}

	// 빌드 산출물 JAR을 target/hr-system.jar 이름으로 고정해서 넣기
	from('build/libs') {
		include '*.jar'
		into 'target'
		rename { 'hr-system.jar' }
	}
}